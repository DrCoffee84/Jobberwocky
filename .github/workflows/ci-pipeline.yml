name: Deploy to Kubernetes

on:
  push:
    tags:
      - 'main*'  # tag pushed to main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Stage 1: Source - Check out the code
    - name: Checkout code
      uses: actions/checkout@v2

    # Stage 2: Unit Test - Run unit tests
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.11.9'  # Asegúrate de usar la versión correcta

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Unit Tests
      run: |
        pytest --maxfail=1 --disable-warnings -q

    # Stage 3: Build Image - Build Docker image
    - name: Set IMAGE_TAG from the pushed tag
      run: |
        echo "IMAGE_TAG=${GITHUB_REF##*/}" >> $GITHUB_ENV  # Extract the tag name from the reference and set it as IMAGE_TAG in environment
    
    - name: Build Docker image
      run: |
        docker build -t avature/jobberwocky:$IMAGE_TAG .

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push Docker image to Docker Hub
      run: |
        docker push avature/jobberwocky:latest

    # Stage 4: Deploy in Kubernetes - Deploy the application
    - name: Set up Kubeconfig
      uses: azure/setup-kubectl@v1
      with:
        kubeconfig: ${{ secrets.KUBECONFIG }}

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -k ./gitops/overlays/dev

    # Stage 5: Post deploy Test - Run tests after deployment
    - name: Post deploy tests with Flask-Testing
      run: |
        python -m unittest qa/post_deploy_test.py  

    # Si prefieres usar Postman CLI para post deploy testing, puedes usar:
    # - name: Run Postman tests with Newman
    #   run: |
    #     newman run your_postman_collection.json
